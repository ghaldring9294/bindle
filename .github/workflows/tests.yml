name: tests

# On releases and pull requests, or by hand (Actions → tests → Run workflow): a private repo pays for Actions
# minutes, macOS at 10x, so not on every push to main. The unit tests run locally before every commit.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the minimum because it's still the system Python on some Macs; Linux runners no longer offer it.
        # One macOS job: the commits are made on a Mac, where the suite runs with a current Python first.
        include:
          - { os: macos-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.x" }
          - { os: windows-latest, python: "3.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        # No PYTHONUTF8: on Windows the default encoding isn't UTF-8, so this job fails a read or write that forgets encoding="utf-8".
        run: python -m unittest discover -s tests -v
