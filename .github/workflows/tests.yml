name: tests

on:
  push:
    branches: [main, windows]
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the minimum because it's still the system Python on some Macs; Linux runners no longer offer it.
        include:
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.x" }
          - { os: ubuntu-latest, python: "3.x" }
          - { os: windows-latest, python: "3.x" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"  # the tests write UTF-8 text with Python's defaults; the code itself always says utf-8
